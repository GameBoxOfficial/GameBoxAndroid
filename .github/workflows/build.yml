name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build APK (up to 3 tries)
        working-directory: GameBoxAndroid
        run: |
          for i in 1 2 3; do
            gradle assembleDebug && exit 0
            echo "Build failed, retry $i of 3 in 30s..."
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: GameBox-apk
          path: GameBoxAndroid/app/build/outputs/apk/debug/app-debug.apk
